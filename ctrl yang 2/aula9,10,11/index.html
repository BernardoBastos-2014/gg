<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>ficha RPG</title>
</head>

<body>
    <div class="conteiner">
        <header>
            <section>
                <div>
                    <p>Nome Do Personagem</p>
                    <input type="text">
                </div>
                <div>
                    <p>XP</p>
                    <input type="number">
                </div>
                <div>
                    <p>Classe</p>
                    <select>
                        <option value="">selecione uma classe</option>
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                        <option value="">4</option>
                        <option value="">5</option>
                        <option value="">6</option>
                        <option value="">7</option>
                        <option value="">8</option>
                        <option value="">9</option>
                        <option value="">10</option>
                    </select>
                </div>
                <div>
                    <p>Raça</p>
                    <select>
                        <option value="">selecione uma Raça</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div>
                    <p>Level</p>
                    <input type="number">
                </div>
                <div>
                    <p>Elemento</p>
                    <select>
                        <option value="">selecione um elemento</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                                <div>
                    <p>Individualidades</p>
                    <select>
                        <option value="">selecione uma Individualidade</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </section>
        </header>
    </div>
    <main>
        <section>
            <div>
                <hr>
                <h2>Status</h2>
                <div>
                    <p>
                        For
                    </p>
                    <input type="number">

                </div>
                <div>
                    <p>
                        Def
                    </p>
                    <input type="number">
                </div>
                <div>
                    <p>
                        Mag
                    </p>
                    <input type="number">
                </div>
                <div>
                    <p>
                        Int
                    </p>
                    <input type="number">
                </div>
                <div>
                    <p>
                        Sor
                    </p>
                    <input type="number">
                </div>
                <div>
                    <p>
                        Vel
                    </p>
                    <input type="number">
                </div>
            </div>
        </section>
    </main>
    <hr>
    <div class="Status-e-Imagen">
        <div class="status-conteiner">
            <div>
                <p>HP</p>
                <input type="number">
            </div>
            <div>
                <p>Mana</p>
                <input type="number">
            </div>
            <div>
                <p>Dinheiro</p>
                <input type="number">
            </div>



        </div>
        <p></p>
        <div class="imagen-conteiner">
            <img src="imagens/OIP.webp" alt="">
        </div>

        <div class="cards-conteiner">
            <div class="text-card">
                <h2>Biografia</h2>
                <textarea cols="40" rows="10"></textarea>
            </div>
            <div class="text-card">
                <h2>Caracteristicas</h2>
                <textarea cols="40" rows="10"></textarea>
            </div>
            <div class="text-card">
                <h2>Inventario</h2>
                <textarea cols="40" rows="42"></textarea>
            </div>
            <div class="text-card">
                <h2>Magias</h2>
                <textarea cols="40" rows="20"></textarea>
            </div>
            <div class="text-card">
                <h2>Ataques</h2>
                <textarea cols="40" rows="15"></textarea>
            </div>

        </div>

        
    </div>


    <script src="script.js"></script>
</body>

</html>
